<header class="topnav">
  <nav class="topnav-inner" aria-label="Main">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="nav-toggle" type="button" aria-controls="nav-links" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <ul id="nav-links" class="nav-links">
      {%- for link in site.data.navigation.main %}
      {%- assign link_url = link.url | relative_url %}
      <li><a href="{{ link_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
      {%- endfor %}
    </ul>
  </nav>
</header>
